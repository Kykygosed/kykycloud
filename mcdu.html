<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A320 MCDU</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:100%;height:100%;background:#0d0d0d;display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace;overflow:hidden; }

.mcdu {
  width:352px;
  background:linear-gradient(165deg,#7fa0be 0%,#5e83a0 45%,#4a6a85 100%);
  border-radius:16px;padding:12px 8px 8px;
  box-shadow:0 10px 50px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.12);
}
.mcdu-header { display:flex;justify-content:space-between;align-items:center;padding:0 4px 8px; }
.corner { width:17px;height:17px;background:#c8c8c8;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.5); }
.leds { display:flex;gap:4px; }
.led { width:21px;height:7px;background:#131313;border-radius:3px;border:1px solid #2a2a2a; }

/* Screen wrap */
.scr-wrap { background:#1c2933;border-radius:10px;padding:5px;margin-bottom:8px;
  box-shadow:inset 0 0 14px rgba(0,0,0,.85),0 0 0 2px #253545; }
.lsk-row { display:flex;align-items:stretch; }
.lsk-col { display:flex;flex-direction:column;justify-content:space-around;padding:1px 0; }
.lsk-col.l { margin-right:3px; }
.lsk-col.r { margin-left:3px; }
.lsk { width:22px;height:26px;background:#080808;border:1px solid #333;border-radius:3px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .08s; }
.lsk::after { content:'—';color:#666;font-size:10px; }
.lsk:hover { background:#1e1e1e; }
.lsk:active { background:#383838; }

#scr { background:#000;border-radius:6px;width:100%;min-height:270px;
  display:flex;flex-direction:column;padding:5px 6px 3px; }
.s-title { text-align:center;font-size:13px;font-weight:bold;color:#fff;
  letter-spacing:1.5px;margin-bottom:1px;min-height:17px; }
.s-rows { flex:1;display:flex;flex-direction:column; }
.s-row { flex:1;display:flex;justify-content:space-between;align-items:center;
  padding:0 1px;min-height:37px; }
.sc { display:flex;flex-direction:column; }
.sc.r { align-items:flex-end;text-align:right; }
.sl { font-size:8.5px;color:#666;text-transform:uppercase;letter-spacing:.3px;min-height:11px; }
.sv { font-size:12.5px;font-weight:bold;line-height:1.2;white-space:nowrap; }
.spad { border-top:1px solid #0e0e0e;padding:3px 3px 0;font-size:12.5px;
  font-weight:bold;color:#fff;min-height:20px;letter-spacing:.4px; }

/* colors */
.w{color:#fff} .g{color:#00df00} .a{color:#ff9800} .c{color:#00c8f0}
.m{color:#ff44ff} .y{color:#ffff00} .r{color:#ff4040} .dim{color:#444}

/* Func btns */
.fb-area { display:flex;flex-direction:column;gap:3px;margin-bottom:3px; }
.fb-row { display:flex;gap:2px;justify-content:center; }
.fb { flex:1;padding:4px 1px;background:#0d0d0d;border:1px solid #3a3a3a;border-radius:4px;
  color:#ccc;font-family:'Courier New',monospace;font-size:8.5px;font-weight:bold;
  cursor:pointer;text-align:center;line-height:1.15;
  box-shadow:0 2px 3px rgba(0,0,0,.6);transition:background .1s; }
.fb:hover{background:#1e1e1e} .fb:active{background:#3a3a3a}
.fb.on{background:#003388;color:#fff;border-color:#004ccc}
.fb.dead{background:#070707;color:#2a2a2a;cursor:default}

/* Keys */
.kb { display:flex;gap:4px;margin-bottom:2px; }
.kb2 { display:flex;gap:3px;margin-top:2px; }
.nb { display:flex;flex-direction:column;gap:3px; }
.nr { display:flex;gap:3px; }
.ab { flex:1;display:flex;flex-direction:column;gap:3px; }
.ar { display:flex;gap:3px; }
.k { width:28px;height:28px;min-width:28px;background:#0d0d0d;border:1px solid #3a3a3a;
  border-radius:5px;color:#d5d5d5;font-family:'Courier New',monospace;font-size:11px;
  font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 4px rgba(0,0,0,.7);transition:background .07s;flex-shrink:0; }
.k:hover{background:#1e1e1e} .k:active{background:#3a3a3a;transform:translateY(1px)}
.kw{width:44px;font-size:8.5px} .kww{width:36px;font-size:9px}
.kbd{border:2px solid #888}
.brow { display:flex;gap:3px;margin-top:2px; }

/* Nav block */
.nv { display:flex;flex-direction:column;gap:3px; }
.nvr { display:flex;gap:3px; }

/* Editor link */
.ed-link {
  position:fixed;top:14px;right:14px;
  background:#001800;border:1px solid #00aa00;border-radius:6px;
  color:#00ee00;font-family:'Courier New',monospace;font-size:11px;
  padding:7px 14px;cursor:pointer;letter-spacing:1px;text-decoration:none;
  box-shadow:0 2px 12px rgba(0,180,0,.18);transition:all .15s;z-index:10;
}
.ed-link:hover{background:#002200;box-shadow:0 2px 18px rgba(0,255,0,.3)}

/* FB status badge */
#fb-status { position:fixed;bottom:14px;right:14px;font-family:'Courier New',monospace;
  font-size:10px;padding:4px 10px;border-radius:4px;border:1px solid #333;color:#666; }
#fb-status.ok{background:#001800;border-color:#006600;color:#00aa00}
#fb-status.err{background:#180000;border-color:#660000;color:#aa0000}
</style>
</head>
<body>
<a href="fpl_editor.html" target="_blank" class="ed-link">✈ FPL EDITOR →</a>

<div class="mcdu">
  <!-- header -->
  <div class="mcdu-header">
    <div class="corner"></div>
    <div class="leds"><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div></div>
    <div class="corner"></div>
  </div>

  <!-- screen + lsk -->
  <div class="scr-wrap">
    <div class="lsk-row">
      <div class="lsk-col l">
        <div class="lsk" onclick="L(1)"></div><div class="lsk" onclick="L(2)"></div>
        <div class="lsk" onclick="L(3)"></div><div class="lsk" onclick="L(4)"></div>
        <div class="lsk" onclick="L(5)"></div><div class="lsk" onclick="L(6)"></div>
      </div>

        <div class="s-title" id="ST"></div>
        <div class="s-rows" id="SR"></div>

      <div class="lsk-col r">
        <div class="lsk" onclick="R(1)"></div><div class="lsk" onclick="R(2)"></div>

        <div class="lsk" onclick="R(5)"></div><div class="lsk" onclick="R(6)"></div>
      </div>
    </div>
  </div>

  <!-- func row 1 -->
  <div class="fb-area">
    <div class="fb-row">
      <button class="fb" onclick="pg('DIR')">DIR</button>
      <button class="fb" onclick="pg('PROG')">PROG</button>
      <button class="fb" onclick="pg('PERF')">PERF</button>
      <button class="fb" id="f-INIT" onclick="pg('INIT')">INIT</button>
      <button class="fb" onclick="pg('DATA')">DATA</button>
      <button class="fb dead"></button>
      <button class="fb dead" style="font-size:8px">BRT</button>
    </div>
    <div class="fb-row">
      <button class="fb" id="f-FPLN" onclick="pg('FPLN')">F-PLN</button>
      <button class="fb" onclick="pg('RADNAV')">RAD<br>NAV</button>
      <button class="fb" onclick="pg('FUEL')">FUEL<br>PRED</button>
      <button class="fb" onclick="pg('SECFPLN')">SEC<br>F-PLN</button>
      <button class="fb" onclick="pg('ATC')">ATC<br>COMM</button>
      <button class="fb" id="f-MENU" onclick="pg('MENU')">MCDU<br>MENU</button>
      <button class="fb dead" style="font-size:8px">DIM</button>
    </div>
  </div>

  <!-- keyboard -->
  <div class="kb">
    <!-- nav block -->
    <div class="nv">
      <div class="nvr">
        <button class="k kw" onclick="pg('AIRPORT')" style="font-size:8px">AIR<br>PORT</button>
        <button class="k kw dead"></button>
      </div>
      <div class="nvr" style="margin-top:5px"><button class="k" onclick="kp('←')">←</button><button class="k" onclick="kp('↑')">↑</button></div>
      <div class="nvr"><button class="k" onclick="kp('→')">→</button><button class="k" onclick="kp('↓')">↓</button></div>
    </div>
    <!-- alpha -->
    <div class="ab">
      <div class="ar"><button class="k" onclick="kp('A')">A</button><button class="k" onclick="kp('B')">B</button><button class="k" onclick="kp('C')">C</button><button class="k" onclick="kp('D')">D</button><button class="k kbd" onclick="kp('E')">E</button></div>
      <div class="ar"><button class="k" onclick="kp('F')">F</button><button class="k" onclick="kp('G')">G</button><button class="k" onclick="kp('H')">H</button><button class="k" onclick="kp('I')">I</button><button class="k" onclick="kp('J')">J</button></div>
      <div class="ar"><button class="k" onclick="kp('K')">K</button><button class="k" onclick="kp('L')">L</button><button class="k" onclick="kp('M')">M</button><button class="k kbd" onclick="kp('N')">N</button><button class="k" onclick="kp('O')">O</button></div>
      <div class="ar"><button class="k" onclick="kp('P')">P</button><button class="k" onclick="kp('Q')">Q</button><button class="k" onclick="kp('R')">R</button><button class="k kbd" onclick="kp('S')">S</button><button class="k" onclick="kp('T')">T</button></div>
      <div class="ar"><button class="k" onclick="kp('U')">U</button><button class="k" onclick="kp('V')">V</button><button class="k kbd" onclick="kp('W')">W</button><button class="k" onclick="kp('X')">X</button><button class="k" onclick="kp('Y')">Y</button></div>
    </div>
  </div>
  <!-- nums + bottom -->
  <div class="kb" style="align-items:flex-end;margin-top:2px">
    <div class="nb">
      <div class="nr"><button class="k" onclick="kp('1')">1</button><button class="k" onclick="kp('2')">2</button><button class="k" onclick="kp('3')">3</button></div>
      <div class="nr"><button class="k" onclick="kp('4')">4</button><button class="k" onclick="kp('5')">5</button><button class="k" onclick="kp('6')">6</button></div>
      <div class="nr"><button class="k" onclick="kp('7')">7</button><button class="k" onclick="kp('8')">8</button><button class="k" onclick="kp('9')">9</button></div>
      <div class="nr"><button class="k" onclick="kp('0')">0</button><button class="k kww" onclick="kp('.')">+/-</button></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;margin-left:4px">
      <div class="brow">
        <button class="k" onclick="kp('Z')">Z</button>
        <button class="k" onclick="kp('/')">/</button>
        <button class="k kww" onclick="kp(' ')">SP</button>
        <button class="k kww" onclick="kp('OVFY')" style="font-size:8px">OVFY<br>▲</button>
        <button class="k kww" onclick="kp('CLR')">CLR</button>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
//  FIREBASE
// ══════════════════════════════════════════════
const fbCfg = {
  apiKey:"AIzaSyDxDzLbCnqYYVknoyHMzbE0gB_SRVLpgiw",
  authDomain:"kyky-c3471.firebaseapp.com",
  databaseURL:"https://kyky-c3471-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"kyky-c3471",
  storageBucket:"kyky-c3471.firebasestorage.app",
  messagingSenderId:"658643330578",
  appId:"1:658643330578:web:758dc26d5504a503e39acb"
};
firebase.initializeApp(fbCfg);
const db = firebase.database();

function fbGet(p)    { return db.ref(p).once('value').then(s=>s.val()); }
function fbSet(p,v)  { return db.ref(p).set(v); }
function fbDel(p)    { return db.ref(p).remove(); }

db.ref('.info/connected').on('value', s=>{
  const el=document.getElementById('fb-status');
  if(s.val()){ el.textContent='DB: CONNECTED ✓'; el.className='ok'; }
  else        { el.textContent='DB: OFFLINE';    el.className='err'; }
});

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
const S = {
  pg:'KY20', sp:'', err:'', clr:false,
  flt:{nbr:'',dep_time:'',dep_arpt:'',arr_arpt:''},
  route:[],         // [{name,type,lat,lon,spd,alt,time}]
  depRwy:null, sid:null, arrRwy:null, ilsWpts:[],
  fplnOff:0,
  // page data
  arrList:[], rwyList:[], sidList:[],
};

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function title(t){document.getElementById('ST').textContent=t;}
function rows(h){document.getElementById('SR').innerHTML=h;}
function spad(){
  const e=document.getElementById('SP');
  if(S.err){
    const c=S.err.startsWith('FORMAT')||S.err.startsWith('NOT')?'y':'a';
    e.innerHTML=`<span class="${c}">${S.err}</span>`;
  } else if(S.clr){
    e.innerHTML=`<span class="w">CLR</span>`;
  } else {
    e.innerHTML=`<span class="w">${S.sp}</span>`;
  }
}

function row(ll,lv,rl,rv,lc='g',rc='g'){
  return `<div class="s-row">
    <div class="sc"><div class="sl">${ll}</div><div class="sv ${lc}">${lv}</div></div>
    <div class="sc r"><div class="sl">${rl}</div><div class="sv ${rc}">${rv}</div></div>
  </div>`;
}

function render(){
  document.querySelectorAll('.fb.on').forEach(b=>b.classList.remove('on'));
  const m={'INIT':'f-INIT','FPLN':'f-FPLN','MENU':'f-MENU'};
  if(m[S.pg]) document.getElementById(m[S.pg])?.classList.add('on');

  const P={KY20,INIT,FPLN,ARRIVAL,DEPINFO,SIDSEL,MENU};
  (P[S.pg]||genericPg)();
  spad();
}

// ══════════════════════════════════════════════
//  PAGES
// ══════════════════════════════════════════════
function KY20(){
  title('KY-20');
  rows(
    row('','','','')+
    row('ACTIVE NAV DATABASE','<span class="c">Kyky-0001DB</span>','','')+
    row('','','','')+
    row('','','','')+
    row('','','','')+
    row('','','SOFTWARE','<span class="a">*RESET &gt;</span>','w','a')
  );
}

function INIT(){
  title('INIT');
  const f=S.flt;
  const nbr  = f.nbr      ? `<span class="c">${f.nbr}</span>`        : `<span class="a">——</span>`;
  const dep  = f.dep_time  ? `<span class="c">${f.dep_time}</span>`   : `<span class="a">——Z</span>`;
  const from = (f.dep_arpt||f.arr_arpt)
    ? `<span class="c">${f.dep_arpt||'??'}/${f.arr_arpt||'??'}</span>`
    : `<span class="a">——/——</span>`;
  rows(
    row('FLT NBR',nbr,'FROM/TO',from,'w','w')+
    row('DEP TIME',dep,'','','w','')+
    row('','','','')+
    row('','','<span class="a">*INIT REQUEST &gt;</span>','','','a')+
    row('','','','')+
    row('','','','')+
    `<div style="font-size:8px;color:#444;text-align:center;padding:2px">LSK1L=FLTNBR · LSK1R=DEP/ARR · LSK2L=DEPTIME · LSK4R=INIT REQ</div>`
  );
}

function FPLN(){
  title('F-PLN');
  const rt=S.route;
  if(!rt.length){
    rows(row('','','','')+row('','','','')+
      `<div class="s-row" style="justify-content:center"><span class="sv dim" style="font-size:15px;opacity:.4">EMPTY</span></div>`+
      row('','','','')+row('','','','')+row('','','',''));
    return;
  }
  let h=`<div class="s-row" style="min-height:14px">
    <div class="sc"><div class="sl">FROM &nbsp;&nbsp;&nbsp; TIME</div></div>
    <div class="sc r"><div class="sl">SPD / ALT</div></div>
  </div>`;
  const vis=rt.slice(S.fplnOff,S.fplnOff+5);
  vis.forEach((it,i)=>{
    const idx=S.fplnOff+i;
    const c=it.type==='arpt'?'a':it.type==='ils'?'m':it.type==='sid'?'c':'g';
    h+=`<div class="s-row" onclick="fplnClick(${idx})" style="cursor:pointer">
      <div class="sc"><div class="sv ${c}" style="font-size:12px">${it.name}</div></div>
      <div class="sc r"><div class="sv g" style="font-size:11px">${it.time||'----'}&nbsp;${it.spd||'---'}/${it.alt||'-----'}</div></div>
    </div>`;
  });
  for(let i=vis.length;i<5;i++) h+=`<div class="s-row"></div>`;
  const arrn=S.flt.arr_arpt||'----';
  h+=`<div class="s-row" onclick="openArr()" style="cursor:pointer">
    <div class="sc"><div class="sv a" style="font-size:12px">${arrn} &gt;</div></div>
    <div class="sc r"><div class="sv dim" style="font-size:10px">${S.arrRwy?'ILS'+S.arrRwy:''}</div></div>
  </div>`;
  rows(h);
}

function ARRIVAL(){
  const arr=S.flt.arr_arpt||'----';
  title(`${arr} ARRIVAL`);
  const list=S.arrList;
  let h=`<div class="s-row"><div class="sc r" style="width:100%"><div class="sl">RWY &nbsp; TYPE</div></div></div>`;
  if(!list.length){
    h+=`<div class="s-row" style="justify-content:center"><span class="sv dim">NO RUNWAYS</span></div>`;
    h+=row('','','','')+row('','','','')+row('','','','');
  } else {
    list.slice(0,4).forEach(r=>{
      const sel=S.arrRwy===r.id;
      h+=`<div class="s-row" onclick="selArrRwy('${r.id}')" style="cursor:pointer">
        <div class="sc"><div class="sv dim" style="font-size:10px">${r.type||'ILS'}</div></div>
        <div class="sc r"><div class="sv ${sel?'g':'a'}">RWY${r.id}</div></div>
      </div>`;
    });
    for(let i=list.length;i<4;i++) h+=`<div class="s-row"></div>`;
  }
  h+=`<div class="s-row" onclick="pg('FPLN')" style="cursor:pointer">
    <div class="sc"><div class="sv w">&lt; RETURN</div></div>
  </div>`;
  rows(h);
}

function DEPINFO(){
  const dep=S.flt.dep_arpt||'----';
  title(`${dep} DEPARTURE`);
  const list=S.rwyList;
  let h=`<div class="s-row"><div class="sc r" style="width:100%"><div class="sl">SELECT RUNWAY</div></div></div>`;
  if(!list.length){
    h+=`<div class="s-row" style="justify-content:center"><span class="sv dim">NO RUNWAYS</span></div>`;
    h+=row('','','','')+row('','','','')+row('','','','');
  } else {
    list.slice(0,4).forEach(r=>{
      const sel=S.depRwy===r.id;
      h+=`<div class="s-row" onclick="selDepRwy('${r.id}')" style="cursor:pointer">
        <div class="sc"><div class="sv dim" style="font-size:10px">SID &gt;</div></div>
        <div class="sc r"><div class="sv ${sel?'g':'a'}">RWY${r.id}</div></div>
      </div>`;
    });
    for(let i=list.length;i<4;i++) h+=`<div class="s-row"></div>`;
  }
  h+=`<div class="s-row" onclick="pg('FPLN')" style="cursor:pointer">
    <div class="sc"><div class="sv w">&lt; RETURN</div></div>
  </div>`;
  rows(h);
}

function SIDSEL(){
  title(`SID · RWY${S.depRwy}`);
  const list=S.sidList;
  let h=`<div class="s-row"><div class="sc"><div class="sl">SID NAME</div></div><div class="sc r"><div class="sl">WPT</div></div></div>`;
  if(!list.length){
    h+=`<div class="s-row" style="justify-content:center"><span class="sv dim">NO SID</span></div>`;
    h+=row('','','','')+row('','','','')+row('','','','');
  } else {
    list.slice(0,4).forEach(s=>{
      const sel=S.sid&&S.sid.name===s.name;
      h+=`<div class="s-row" onclick="selSID('${s.name}')" style="cursor:pointer">
        <div class="sc"><div class="sv ${sel?'g':'a'}">${s.name}</div></div>
        <div class="sc r"><div class="sv dim" style="font-size:10px">${s.wpts?Object.keys(s.wpts).length:0} WPT</div></div>
      </div>`;
    });
    for(let i=list.length;i<4;i++) h+=`<div class="s-row"></div>`;
  }
  h+=`<div class="s-row" onclick="pg('DEPINFO')" style="cursor:pointer">
    <div class="sc"><div class="sv w">&lt; RETURN</div></div>
  </div>`;
  rows(h);
}

function MENU(){
  title('MCDU MENU');
  rows(
    row('','<span class="c">FMGC</span>','','','w','')+
    row('','','<span class="a">FPL EDITOR &gt;</span>','','','a')+
    row('','','','')+row('','','','')+row('','','','')+
    row('<span class="w">&lt; RETURN</span>','','','','w','')
  );
}

function genericPg(){
  title(S.pg);
  rows(`<div class="s-row" style="justify-content:center;flex:1"><span class="sv dim" style="font-size:11px;padding:30px">PAGE INDISP.</span></div>`);
}

// ══════════════════════════════════════════════
//  LSK
// ══════════════════════════════════════════════
function L(n){ lsk(n,'L'); }
function R(n){ lsk(n,'R'); }

function lsk(n,side){
  const sp=S.sp.trim().toUpperCase();
  const clr=S.clr;

  if(S.pg==='KY20'){
    if(n===6&&side==='R') doReset();
  }
  else if(S.pg==='INIT'){
    if(n===1&&side==='L'){ if(sp){S.flt.nbr=sp;clearSP();} }
    else if(n===1&&side==='R'){
      if(sp){
        if(!sp.includes('/')){setErr('FORMAT ERROR');return;}
        const [d,a]=sp.split('/');
        S.flt.dep_arpt=d.toUpperCase(); S.flt.arr_arpt=a.toUpperCase();
        clearSP();
      }
    }
    else if(n===2&&side==='L'){
      if(sp){
        if(!/^\d{1,4}$/.test(sp)){setErr('FORMAT ERROR');return;}
        S.flt.dep_time=sp.padStart(4,'0')+'Z'; clearSP();
      }
    }
    else if(n===4&&side==='R') doInitReq();
  }
  else if(S.pg==='FPLN'){
    if(n===6&&side==='L'){openArr();return;}
    if(n===1&&side==='L'&&S.route[0]?.type==='arpt'){openDep();return;}
    // CLR on wpt rows 1-5
    const idx=S.fplnOff+(n-1);
    if(clr && n>=1 && n<=5 && S.route[idx]){
      S.route.splice(idx,1); S.clr=false; syncActive();
    }
  }
  else if(S.pg==='ARRIVAL'){
    if(n===6&&side==='L'){pg('FPLN');return;}
    const ri=n-2;
    if(ri>=0&&ri<S.arrList.length) selArrRwy(S.arrList[ri].id);
  }
  else if(S.pg==='DEPINFO'){
    if(n===6&&side==='L'){pg('FPLN');return;}
    const ri=n-2;
    if(ri>=0&&ri<S.rwyList.length) selDepRwy(S.rwyList[ri].id);
  }
  else if(S.pg==='SIDSEL'){
    if(n===6&&side==='L'){pg('DEPINFO');return;}
    const ri=n-2;
    if(ri>=0&&ri<S.sidList.length) selSID(S.sidList[ri].name);
  }
  else if(S.pg==='MENU'){
    if(n===6&&side==='L') pg('INIT');
    if(n===2&&side==='R') window.open('fpl_editor.html','_blank');
  }
  render();
}

// ══════════════════════════════════════════════
//  KEY INPUT
// ══════════════════════════════════════════════
function kp(k){
  S.err='';
  if(k==='CLR'){
    if(S.clr) S.clr=false;
    else if(S.sp.length>0) S.sp=S.sp.slice(0,-1);
    else S.clr=true;
  } else if(k==='↑'){
    if(S.pg==='FPLN'&&S.fplnOff>0) S.fplnOff--;
  } else if(k==='↓'){
    if(S.pg==='FPLN') S.fplnOff=Math.min(S.fplnOff+1,Math.max(0,S.route.length-2));
  } else if(k==='OVFY'||k==='←'||k==='→'){
    // intentional no-op
  } else {
    S.clr=false; S.sp+=k;
  }
  render();
}

function pg(p){
  S.pg=p; S.sp=''; S.err=''; S.clr=false; S.fplnOff=0;
  render();
}

// ══════════════════════════════════════════════
//  ACTIONS
// ══════════════════════════════════════════════
function setErr(m){ S.err=m; S.sp=''; render(); }
function clearSP(){ S.sp=''; S.err=''; S.clr=false; render(); }

function doReset(){
  if(!confirm('Reset MCDU – clear all data?')) return;
  Object.assign(S,{flt:{nbr:'',dep_time:'',dep_arpt:'',arr_arpt:''},
    route:[],depRwy:null,sid:null,arrRwy:null,ilsWpts:[],fplnOff:0,pg:'KY20',sp:'',err:'',clr:false});
  fbDel('active').catch(()=>{});
  render();
}

async function doInitReq(){
  setErr('REQUESTING…');
  try{
    const data=await fbGet('flt');
    if(!data){setErr('NO FPL DATA');return;}
    if(data.flt_nbr)  S.flt.nbr=data.flt_nbr;
    if(data.dep_time) S.flt.dep_time=data.dep_time;
    if(data.dep_arpt) S.flt.dep_arpt=data.dep_arpt;
    if(data.arr_arpt) S.flt.arr_arpt=data.arr_arpt;
    // Load route
    S.route=[];
    if(data.route){
      const ent=Object.entries(data.route).sort(([a],[b])=>+a-+b);
      ent.forEach(([,v])=>{ if(v&&v.name) S.route.push(v); });
    }
    S.err=''; S.pg='FPLN';
    syncActive();
  }catch(e){ setErr('LINK ERROR'); }
  render();
}

async function openArr(){
  pg('ARRIVAL');
  const arr=S.flt.arr_arpt;
  if(!arr){S.arrList=[];render();return;}
  try{
    const d=await fbGet(`arpt/${arr}/runways`);
    S.arrList=d?Object.entries(d).map(([id,v])=>({id,...v})):[];
  }catch(e){S.arrList=[];}
  render();
}

async function openDep(){
  pg('DEPINFO');
  const dep=S.flt.dep_arpt;
  if(!dep){S.rwyList=[];render();return;}
  try{
    const d=await fbGet(`arpt/${dep}/runways`);
    S.rwyList=d?Object.entries(d).map(([id,v])=>({id,...v})):[];
  }catch(e){S.rwyList=[];}
  render();
}

async function selDepRwy(id){
  S.depRwy=id;
  const dep=S.flt.dep_arpt;
  try{
    const d=await fbGet(`arpt/${dep}/sid/${id}`);
    S.sidList=d?Object.values(d):[];
  }catch(e){S.sidList=[];}
  pg('SIDSEL');
}

async function selSID(name){
  const sid=S.sidList.find(s=>s.name===name)||{name};
  S.sid=sid;
  // Strip old SID entries, re-inject after dep arpt
  S.route=S.route.filter(w=>w.type!=='sid');
  if(sid.wpts){
    const wArr=Object.values(sid.wpts).sort((a,b)=>(a.order||0)-(b.order||0));
    const di=S.route.findIndex(w=>w.type==='arpt'&&w.name===S.flt.dep_arpt);
    const at=di>=0?di+1:0;
    wArr.forEach((w,i)=>S.route.splice(at+i,0,{...w,type:'sid'}));
  }
  syncActive(); pg('FPLN');
}

async function selArrRwy(id){
  S.arrRwy=id;
  const arr=S.flt.arr_arpt;
  S.route=S.route.filter(w=>w.type!=='ils');
  try{
    const d=await fbGet(`arpt/${arr}/ils/${id}`);
    if(d){
      const wArr=Object.values(d).sort((a,b)=>(a.order||0)-(b.order||0));
      S.ilsWpts=wArr;
      const ai=S.route.findIndex(w=>w.type==='arpt'&&w.name===arr);
      if(ai>=0) wArr.forEach((w,i)=>S.route.splice(ai+i,0,{...w,type:'ils'}));
      else wArr.forEach(w=>S.route.push({...w,type:'ils'}));
    } else { S.ilsWpts=[]; }
  }catch(e){S.ilsWpts=[];}
  syncActive(); pg('FPLN');
}

function fplnClick(idx){
  if(idx===0&&S.route[0]?.type==='arpt') openDep();
}

async function syncActive(){
  const p={
    flt:S.flt,
    route:Object.fromEntries(S.route.map((w,i)=>[i+1,w])),
    dep_rwy:S.depRwy||null,
    sid:S.sid||null,
    arr_rwy:S.arrRwy||null
  };
  await fbSet('active',p).catch(()=>{});
}

// Physical keyboard
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  const k=e.key;
  if(k.length===1&&/[A-Z0-9\/\-\.]/i.test(k)) kp(k.toUpperCase());
  else if(k==='Backspace') kp('CLR');
  else if(k==='ArrowUp') kp('↑');
  else if(k==='ArrowDown') kp('↓');
});

render();
</script>
